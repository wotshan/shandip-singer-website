<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Raag Sargam animated README banner</title>
  <desc id="desc">Animated dark cinematic banner with subtle red gradients, shimmer and editorial typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.45" stop-color="#12070a"/>
      <stop offset="1" stop-color="#050505"/>
      <animate attributeName="x1" values="0;120;0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;1080;1200" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 120) rotate(35) scale(420 220)">
      <stop stop-color="#8f1024" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8f1024" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 300) rotate(-20) scale(360 220)">
      <stop stop-color="#5f0d18" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5f0d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" x1="-300" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-300;1500" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1800" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <style>
      .eyebrow { font: 600 18px Inter, Arial, sans-serif; letter-spacing: 0.34em; fill: #d7d7d7; opacity: 0.9; }
      .title { font: 700 80px 'Cormorant Garamond', Georgia, serif; letter-spacing: 0.06em; fill: #ffffff; }
      .tagline { font: 500 26px Inter, Arial, sans-serif; fill: #c9c9c9; }
      .meta { font: 500 18px Inter, Arial, sans-serif; fill: #a8a8a8; }
      .line { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .pulse { opacity: 0.55; }
      @media (prefers-reduced-motion: reduce) {
        animate { display: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="rgba(255,255,255,0.08)"/>
  <ellipse cx="220" cy="120" rx="420" ry="220" fill="url(#glowLeft)" filter="url(#blur)" class="pulse">
    <animate attributeName="opacity" values="0.45;0.7;0.45" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="980" cy="300" rx="360" ry="220" fill="url(#glowRight)" filter="url(#blur)" class="pulse">
    <animate attributeName="opacity" values="0.28;0.5;0.28" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <g opacity="0.9">
    <line x1="84" y1="92" x2="196" y2="92" class="line"/>
    <text x="84" y="78" class="eyebrow">LIVE PERFORMANCE WEBSITE</text>
  </g>
  <g>
    <text x="84" y="190" class="title">RAAG SARGAM</text>
    <text x="84" y="238" class="tagline">Premium cinematic singer website built with React, TypeScript, Tailwind CSS and Vite.</text>
    <text x="84" y="286" class="meta">Real gallery photography • Real contact links • Accessible motion • GitHub Actions CI</text>
  </g>
  <g transform="translate(84 326)">
    <rect width="220" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="22" y="27" class="meta" fill="#f3f3f3">Your occasion. My voice.</text>
  </g>
  <g transform="translate(332 326)">
    <rect width="250" height="42" rx="21" fill="rgba(143,16,36,0.18)" stroke="rgba(255,255,255,0.08)"/>
    <text x="22" y="27" class="meta" fill="#f3f3f3">One unforgettable night.</text>
  </g>
  <rect x="0" y="0" width="1200" height="420" rx="28" fill="url(#shimmer)" opacity="0.55"/>
</svg>
