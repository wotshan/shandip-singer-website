      <stop offset="0" stop-color="#2a0a10" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#7f1324" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
